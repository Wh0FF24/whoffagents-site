version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node --version
        - npm install
    build:
      commands:
        - npm run build
        - node scripts/prerender.mjs
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customRules:
    - source: '/robots.txt'
      target: /robots.txt
      status: '200'
    - source: '/sitemap.xml'
      target: /sitemap.xml
      status: '200'
    - source: '<^[^.]+$>'
      target: /index.html
      status: '200'
    - source: '/<*>'
      target: /index.html
      status: '200'
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
